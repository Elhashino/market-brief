name: morning-brief
on:
  schedule:
    - cron: '15 7 * * 1-5'    # 08:15 UK summer / 07:15 winter
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install yfinance pandas numpy requests
      - run: python cloud_brief.py
      - name: publish page
        run: |
          git config user.name "brief-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html
          git commit -m "morning brief" || echo "no change"
          git push
