name: morning-brief
on:
  schedule:
    # GitHub's scheduler runs these 6-8 HOURS late (measured 28 Sep: the 04:17
    # slot fired 10:58 UTC). So we order breakfast at midnight: night slots
    # whose lag lands in the UK morning. The script refuses to ping before
    # 06:00 UK and stands down once a brief is on the channel — so early,
    # late and duplicate runs are all harmless.
    - cron: '37 23 * * 0-4'
    - cron: '37 0 * * 1-5'
    - cron: '37 1 * * 1-5'
    - cron: '37 2 * * 1-5'
    - cron: '37 3 * * 1-5'
    - cron: '37 5 * * 1-5'
    - cron: '37 7 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install yfinance pandas numpy requests
      - run: python cloud_brief.py
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
      - name: publish page
        run: |
          git config user.name "brief-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html
          git commit -m "morning brief" || echo "no change"
          git push
