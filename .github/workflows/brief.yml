name: morning-brief
on:
  schedule:
    # GitHub's scheduler runs these hours late on quiet repos (measured ~5.5h):
    # several early slots so one lands in the morning; the script stands down
    # once a brief is already on the channel.
    - cron: '17 4 * * 1-5'
    - cron: '17 5 * * 1-5'
    - cron: '17 6 * * 1-5'
    - cron: '17 7 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install yfinance pandas numpy requests
      - run: python cloud_brief.py
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
      - name: publish page
        run: |
          git config user.name "brief-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html
          git commit -m "morning brief" || echo "no change"
          git push
